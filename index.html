<style>
  :root { --ratio: 0.5625; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #c60a12;
    overflow: hidden;
    font-family: "Montserrat", system-ui, sans-serif;
  }
  /* Moldura que sempre ocupa a tela inteira do celular (inclusive quando a barra do navegador some) */
  .frame {
    position: fixed;
    inset: 0;
    overflow: hidden;
    container-type: size;
    /* cores tiradas das bordas da arte: vermelho vivo em cima, vermelho escuro no rodapé */
    background: linear-gradient(180deg, #fe1112 0%, #fe1112 25%, #c60a12 100%);
  }

  /* Funde a base da arte com o rodapé */
  .stage::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -1px;
    height: 10%;
    background: linear-gradient(180deg, rgba(198, 10, 18, 0) 0%, #c60a12 100%);
    pointer-events: none;
  }
  /* Navegadores antigos sem container queries */
  @supports not (container-type: size) {
    .stage {
      --w: max(100vw, calc(100vh * var(--ratio)));
      left: calc((100vw - var(--w)) / 2);
      top: calc((100vh - var(--h)) * 0.25);
    }
  }
  /* Em telas deitadas (computador), mostra a arte inteira centralizada */
  @media (min-aspect-ratio: 9/16) and (min-width: 700px) {
    .stage {
      --w: calc(100cqh * var(--ratio));
      top: 0;
    }
    .stage::after { display: none; }
  }
  .cta {
    position: absolute;
    z-index: 1;
    left: 50%;
    top: 67.5%;
    transform: translateX(-50%);
    width: max-content;
    max-width: calc(100vw - 32px);
    font-size: clamp(11px, min(calc(var(--w) * 0.03), 3.1vw), 17px);
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: .6em;
    padding: 1em 1.35em;
    border: 2px solid #fff;
    border-radius: 999px;
    background: transparent;
    color: #fff;
    font-weight: 800;
    letter-spacing: .02em;
    white-space: nowrap;
    text-transform: uppercase;
    text-decoration: none;
    text-align: center;
    -webkit-tap-highlight-color: transparent;
    transition: background .25s, transform .25s;
  }
  .btn svg { width: 1.15em; height: 1.15em; flex: none; transition: transform .25s; }
  .btn:hover, .btn:focus-visible, .btn:active {
    background: rgba(255, 255, 255, .14);
    transform: translateY(-2px);
    outline: none;
  }
  .btn:hover svg, .btn:focus-visible svg { transform: translateX(4px); }
  .ig {
    position: absolute;
    left: 11.9%;
    top: 14.4%;
    display: inline-flex;
    align-items: center;
    gap: .45em;
    padding: .45em .9em;
    border: 1.5px solid #fff;
    border-radius: 999px;
    color: #fff;
    font-size: clamp(9px, min(calc(var(--w) * 0.019), 2.4vw), 12px);
    font-weight: 700;
    letter-spacing: .02em;
    text-decoration: none;
    white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
    transition: background .25s;
  }
  .ig svg { width: 1.2em; height: 1.2em; flex: none; }
  .ig:hover, .ig:focus-visible, .ig:active { background: rgba(255, 255, 255, .14); outline: none; }
</style>
